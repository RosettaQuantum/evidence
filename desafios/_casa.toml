# La VARA DE CASA — se aplica a TODO entregable publico, sea cual sea el desafio.
#
# Derivada de ESTANDAR-presentacion-entregable.md §3, §4 y §5. No se invento aqui:
# cada item lleva la cita de la seccion del estandar de la que sale.
#
# El estandar existia desde antes como texto de 149 lineas y NADA lo comprobaba: los
# generadores lo escribian, ninguna guardia lo verificaba. Esta ficha es lo que lo pone
# en la ruta del archivo que viaja.

[requisitos]
seccion_mapeo = '''Resultados contra lo que ustedes piden|Results against what you asked for'''

[[requisitos.item]]
id      = '''C1'''
seccion = '''5'''
nivel   = '''OBLIGATORIO'''
cita    = '''Resumen — que se pregunto, que se hizo, que salio'''
patron  = '''(?im)^#{1,3} .*\b(resumen|summary)\b'''

