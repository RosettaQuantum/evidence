# Configuracion del track HSBC para el corredor `replicar.py`.
# La bateria de verificacion post-CI se define AQUI, una vez, y el corredor la ejerce
# SIEMPRE — el tramo que antes se escribia a mano cada vez, donde un olvido no se nota.

[track]
nombre = "hsbc"
workflow = "experimento-hsbc.yml"
resultados = "resultados_hsbc"

[datos]
manifest_id = "RQ-DATA-HSBC-ULB-001"
arff_sha256 = "fdaf12730dc1fc426f318b71349f24f5c5fd00aa1152940be7e7509ae3d89d2a"

[preregs]
ids = ["RQ-PREREG-HSBC-001", "RQ-PREREG-HSBC-002-ATAQUE",
       "RQ-PREREG-HSBC-003-CUANTICO"]
# El 003 faltaba: el brazo cuantico corrio y se sello SIN que la bateria de guardias
# lo cubriera. Un pre-registro que el corredor no lista es un pre-registro que nadie
# ejerce — y no se nota, porque el corredor pasa igual.

[harness]
ruta = "harness/hsbc_harness.py"
archivadas = "code/hsbc_harness@*.py"

[guardias]
# campos que TODO artefacto del track debe traer; su ausencia es fallo, no aviso
campos_siempre = ["arff_sha256", "harness_sha256", "manifest"]
campos_baseline = ["particion", "modelos"]
campos_ataque = ["ataque", "corridas", "resumen", "prereg"]

[requisitos]
# La lista DERIVADA DEL ENUNCIADO. El motor vive en harness/guardia_requisitos.py.
# Estaba en evidence-staging/requisitos_hsbc.py — local a un desafio y fuera del
# archivo, o sea que el desafio siguiente partia de cero en este eje.
seccion_mapeo = '''Resultados contra lo que ustedes piden|Results against what you asked for'''

